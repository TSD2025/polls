<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Dinner 2025</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000; /* Black background */
      color: #ffd700; /* Gold text */
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-bottom: 2px solid #ffd700;
      padding-bottom: 10px;
      text-transform: uppercase;
    }

    p {
      font-size: 1.3rem;
      margin-top: 10px;
      color: #f1c40f;
    }

    .container {
      background: rgba(255, 215, 0, 0.05);
      border: 1px solid #ffd700;
      padding: 40px;
      border-radius: 10px;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Senior Dinner 2025</h1>
    <p>Below are the voting polls</p>
  </div>
</body>
</html>
